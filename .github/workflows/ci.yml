name: correctness
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest
  compiler-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ clang llvm lld
      - run: python -m pip install -e '.[dev]'
      - name: Deliberate semantic mutation must be rejected
        run: |
          python -m compilerpilot data --commands 100000
          python scripts/check_gate.py --input data/eval.lob --output results/ci-gate-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-evidence
          path: results/ci-gate-check.json
