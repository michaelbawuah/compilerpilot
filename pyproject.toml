[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compilerpilot"
version = "0.1.0"
description = "Correctness-gated compiler search for Ledger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "pandas>=2", "pyarrow>=14", "scikit-learn>=1.3", "PyYAML>=6", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
compilerpilot = "compilerpilot.cli:main"

[tool.setuptools.packages.find]
include = ["compilerpilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
